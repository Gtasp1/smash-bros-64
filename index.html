<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Smash Bros.</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        #start-screen {
            position: fixed;
            inset: 0;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }
        #start-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            border-radius: 12px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        #start-btn:active {
            background: #45a049;
        }
        #status {
            margin-top: 16px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h2>Super Smash Bros.</h2>
        <p>Pulsa el botón para cargar el juego</p>
        <button id="start-btn">▶ Jugar</button>
        <div id="status"></div>
    </div>

    <div id="game-container"></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const status = document.getElementById('status');

        startBtn.addEventListener('click', function () {
            startBtn.style.display = 'none';
            status.textContent = 'Cargando... espera (N64 puede tardar, sobre todo en móvil)';

            EJS_player = '#game-container';
            EJS_core = 'n64';
            EJS_gameUrl = 'super-smash-bros.n64';   // ← cambia al nombre real de tu ROM (.z64 / .n64 / .v64)
            EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            EJS_startOnLoaded = true;
            EJS_color = '#000000';

            // Opcional: si el core por defecto va mal, prueba uno de estos:
            // EJS_core = 'mupen64plus_next';
            // EJS_core = 'parallel-n64';

            window.EJS_ready = function () {
                startScreen.style.display = 'none';
            };

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
